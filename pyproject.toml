[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "ghstack_tui"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = ["textual>=5.0"]

[project.scripts]
ghstack-tui = "ghstack_tui.__main__:main"

[tool.hatch.build.targets.wheel]
packages = ["src/ghstack_tui"]

[tool.pytest.ini_options]
asyncio_mode = "auto"

# Copy to ~/.config/ghstack-tui/config.toml or point GHSTACK_TUI_CONFIG at it.

[paths]
default_checkout_path = "~/git/pytorch"
clones_root = "~/git"
triage_cache_path = "~/.config/ghstack-tui/triage-cache.json"
mcp_config_dir = "~/.config/ghstack-tui"

[search]
default_query = "is:pr is:open author:@me"
clones_prefix = "pytorch"
gh_search_limit = 200

[agents]
claude_command = "claude"

[prompts]
claude_fix_ci_template = "Use ghstack to checkout to #{pr_num}. Fix the CI failures on PR #{pr_num}. Failing jobs: {shown}{suffix}. Use get_failing_jobs to list all failures, get_pr_diff to understand the changes, then fix the issues."
claude_review_template = "Review PR #{pr_num}. Use get_pr_info and get_pr_diff to understand the changes. If needed, use ghstack to checkout to #{pr_num}"

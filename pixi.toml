[workspace]
channels = ["conda-forge"]
name = "ghstack-tui"
platforms = ["osx-arm64", "linux-64"]
version = "0.1.0"

[tasks]
tui = "python -m ghstack_tui"
update = "git pull origin main"

[dependencies]
python = ">=3.11,<3.13"
pip = "*"
difftastic = "*"

[pypi-dependencies]
textual = ">=5.0"
ghstack_tui = { path = ".", editable = true }
pytest = ">=8"
pytest-asyncio = ">=0.23"
mcp = ">=1.0"

[tasks.test]
cmd = "pytest tests/ -v"
